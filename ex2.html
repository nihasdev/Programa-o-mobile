<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Completo</title>
    <link rel="stylesheet" href="ex2.css">
</head>
<body>

    <div class="container">
        <h2>Cadastro</h2>

        <div id="listaErros"></div>

        <form id="formulario">

            <label>Nome</label>
            <input type="text" id="nome">
            <small id="erroNome" class="erro"></small>

            <label>CPF</label>
            <input type="text" id="cpf">
            <small id="erroCpf" class="erro"></small>

            <label>Data de Nascimento</label>
            <input type="date" id="nascimento">
            <small id="erroNascimento" class="erro"></small>

            <label>Senha</label>
            <input type="password" id="senha">
            <small id="erroSenha" class="erro"></small>

            <label>Confirmar Senha</label>
            <input type="password" id="confirmarSenha">
            <small id="erroConfirmarSenha" class="erro"></small>

            <button type="submit">Cadastrar</button>

        </form>
    </div>

    <script src="ex2.js"></script>

</body>
</html>
